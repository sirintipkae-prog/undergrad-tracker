<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฝ่ายการศึกษาก่อนปริญญา - ระบบติดตามงานและ KPI</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Sarabun", sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 40px; }
        header { background: linear-gradient(to right, #1e3a8a, #3b82f6); color: white; padding: 16px 24px; }
        .header-title { font-size: 20px; font-weight: bold; }
        .header-sub { font-size: 12px; opacity: 0.8; }
        .nav-tabs { display: flex; gap: 8px; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); pt: 8px; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: #cbd5e1; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: white; border-bottom-color: white; font-weight: bold; }
        .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; shadow: 0 1px 3px rgba(0,0,0,0.05); }
        .card-title { font-size: 12px; color: #64748b; font-weight: 600; }
        .card-value { font-size: 28px; font-weight: bold; margin-top: 4px; color: #0f172a; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        th, td { padding: 12px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .modal.hidden { display: none; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="header-title">ฝ่ายการศึกษาก่อนปริญญา</div>
                <div class="header-sub">Undergraduate Education Task & KPI Tracker</div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="openTaskModal()">+ เพิ่ม Task ใหม่</button>
            </div>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('tasks')">รายการงานทั้งหมด</button>
            <button class="tab-btn" onclick="switchTab('team')">ทีมงาน</button>
        </div>
    </header>

    <div class="container">
        <!-- TAB 1: DASHBOARD -->
        <div id="view-dashboard">
            <div class="card-grid">
                <div class="card"><div class="card-title">งานทั้งหมด</div><div class="card-value" id="stat-total">0</div></div>
                <div class="card"><div class="card-title">เสร็จสิ้นแล้ว</div><div class="card-value" id="stat-completed" style="color: #10b981;">0</div></div>
                <div class="card"><div class="card-title">กำลังดำเนินการ</div><div class="card-value" id="stat-progress" style="color: #f59e0b;">0</div></div>
            </div>
            <div class="card">
                <h3 style="font-size: 16px; margin-bottom: 12px;">รายการงานหลัก</h3>
                <div id="dashboard-list"></div>
            </div>
        </div>

        <!-- TAB 2: TASKS -->
        <div id="view-tasks" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>ชื่องาน</th>
                        <th>ผู้รับผิดชอบ</th>
                        <th>ความก้าวหน้า</th>
                        <th>KPI (ทำได้/เป้า)</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="task-tbody"></tbody>
            </table>
        </div>

        <!-- TAB 3: TEAM -->
        <div id="view-team" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                <h3>รายชื่อสมาชิกในทีม</h3>
                <button class="btn btn-primary" onclick="openMemberModal()">+ เพิ่มสมาชิก</button>
            </div>
            <div class="card-grid" id="team-grid"></div>
        </div>
    </div>

    <!-- MODAL TASK -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">จัดการรายการงาน</h3>
            <form onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="form-group"><label>ชื่องาน</label><input type="text" id="task-title" required></div>
                <div class="form-group"><label>ผู้รับผิดชอบ</label><select id="task-assignee"></select></div>
                <div class="form-group"><label>เป้าหมาย KPI (ตัวเลข)</label><input type="number" id="task-kpi-target"></div>
                <div class="form-group"><label>ผลงานที่ทำได้ปัจจุบัน</label><input type="number" id="task-kpi-current"></div>
                <div class="form-group"><label>ความก้าวหน้า (%)</label><input type="number" id="task-progress" min="0" max="100"></div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">ยกเลิก</button>
                    <button type="submit" class="btn btn-primary">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL MEMBER -->
    <div id="memberModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">จัดการสมาชิก</h3>
            <form onsubmit="saveMember(event)">
                <input type="hidden" id="member-id">
                <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="member-name" required></div>
                <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="member-role" required></div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">ยกเลิก</button>
                    <button type="submit" class="btn btn-primary">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let members = JSON.parse(localStorage.getItem('pure_members')) || [
            { id: 'm1', name: 'ดร. นพ. สมชาย', role: 'หัวหน้าฝ่าย' },
            { id: 'm2', name: 'คุณวิภา', role: 'นักวิชาการศึกษา' }
        ];

        let tasks = JSON.parse(localStorage.getItem('pure_tasks')) || [
            { id: 't1', title: 'ทวนสอบรายวิชา', assigneeId: 'm2', progress: 20, kpiTarget: 10, kpiCurrent: 2 },
            { id: 't2', title: 'อนุมัติปริญญา', assigneeId: 'm1', progress: 80, kpiTarget: 100, kpiCurrent: 80 }
        ];

        window.onload = function() { render(); };

        function saveData() {
            localStorage.setItem('pure_members', JSON.stringify(members));
            localStorage.setItem('pure_tasks', JSON.stringify(tasks));
            render();
        }

        function render() {
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-completed').textContent = tasks.filter(t => t.progress == 100).length;
            document.getElementById('stat-progress').textContent = tasks.filter(t => t.progress > 0 && t.progress < 100).length;

            let dashHtml = '';
            tasks.forEach(t => {
                let m = members.find(x => x.id == t.assigneeId);
                dashHtml += `<div style="padding: 8px 0; border-bottom: 1px solid #f1f5f9;"><strong>${t.title}</strong> - ${m ? m.name : ''} (${t.progress}%)</div>`;
            });
            document.getElementById('dashboard-list').innerHTML = dashHtml;

            let tableHtml = '';
            tasks.forEach(t => {
                let m = members.find(x => x.id == t.assigneeId);
                tableHtml += `<tr>
                    <td>${t.title}</td>
                    <td>${m ? m.name : '-'}</td>
                    <td><input type="range" value="${t.progress}" onchange="updateProgress('${t.id}', this.value)"> ${t.progress}%</td>
                    <td>${t.kpiCurrent || 0} / ${t.kpiTarget || 0}</td>
                    <td><button class="btn btn-danger" onclick="deleteTask('${t.id}')">ลบ</button></td>
                </tr>`;
            });
            document.getElementById('task-tbody').innerHTML = tableHtml;

            let teamHtml = '';
            members.forEach(m => {
                teamHtml += `<div class="card"><strong>${m.name}</strong><br><small>${m.role}</small></div>`;
            });
            document.getElementById('team-grid').innerHTML = teamHtml;

            let selectHtml = '';
            members.forEach(m => { selectHtml += `<option value="${m.id}">${m.name}</option>`; });
            document.getElementById('task-assignee').innerHTML = selectHtml;
        }

        function switchTab(tab) {
            document.getElementById('view-dashboard').style.display = tab == 'dashboard' ? 'block' : 'none';
            document.getElementById('view-tasks').style.display = tab == 'tasks' ? 'block' : 'none';
            document.getElementById('view-team').style.display = tab == 'team' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateProgress(id, val) {
            let t = tasks.find(x => x.id == id);
            if (t) { t.progress = val; saveData(); }
        }

        function openTaskModal() { document.getElementById('taskModal').classList.remove('hidden'); }
        function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); }
        function openMemberModal() { document.getElementById('memberModal').classList.remove('hidden'); }
        function closeMemberModal() { document.getElementById('memberModal').classList.add('hidden'); }

        function saveTask(e) {
            e.preventDefault();
            tasks.push({
                id: 't' + Date.now(),
                title: document.getElementById('task-title').value,
                assigneeId: document.getElementById('task-assignee').value,
                kpiTarget: document.getElementById('task-kpi-target').value,
                kpiCurrent: document.getElementById('task-kpi-current').value,
                progress: document.getElementById('task-progress').value || 0
            });
            saveData();
            closeTaskModal();
        }

        function saveMember(e) {
            e.preventDefault();
            members.push({
                id: 'm' + Date.now(),
                name: document.getElementById('member-name').value,
                role: document.getElementById('member-role').value
            });
            saveData();
            closeMemberModal();
        }

        function deleteTask(id) {
            tasks = tasks.filter(x => x.id != id);
            saveData();
        }
    </script>
</body>
</html>
